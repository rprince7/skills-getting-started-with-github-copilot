<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lit Element Examples</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }
    
    .header {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .header h1 {
      color: #333;
    }

    .section {
      margin-bottom: 40px;
    }

    .section h2 {
      color: #333;
      border-bottom: 2px solid #667eea;
      padding-bottom: 10px;
    }

    .cards-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🎯 Lit Element Examples</h1>
    <p>Multiple component demonstrations</p>
  </div>
  
  <div class="section">
    <h2>Interactive Counter Component</h2>
    <my-element name="Lit Developer"></my-element>
  </div>

  <div class="section">
    <h2>Card Components</h2>
    <div class="cards-container">
      <card-element 
        title="Lit Element" 
        description="A simple library for building fast, lightweight web components.">
      </card-element>
      
      <card-element 
        title="Web Components" 
        description="Create reusable custom elements with encapsulated functionality.">
      </card-element>
      
      <card-element 
        title="Shadow DOM" 
        description="Scoped styles and markup for better component isolation.">
      </card-element>
    </div>
  </div>
  
  <script type="module" src="/my-element.js"></script>
  <script type="module" src="/card-element.js"></script>
</body>
</html>
